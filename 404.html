<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACKLY | Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        html, body {
            margin: 0;
            padding: 0 !important;
            min-height: 100%;
            background-color: #0a192f !important;
            overflow-x: hidden;
        }

        body.error-body {
            padding-top: 0 !important;
        }

        .error-page {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary) 0%, #0a192f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 3rem 1.25rem;
        }

        .error-content {
            z-index: 10;
            text-align: center;
            color: var(--white);
            max-width: 600px;
            margin: 0 auto;
        }

        .error-title {
            font-size: clamp(6.5rem, 18vw, 13rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--teal), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(25, 183, 176, 0.3);
            position: relative;
        }

        .error-subtitle {
            font-size: clamp(1.6rem, 4.5vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .error-text {
            color: rgba(255, 255, 255, 0.75);
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            max-width: 500px;
            margin: 0 auto 2rem;
            line-height: 1.6;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-buttons .btn-outline-light {
            padding: 14px 32px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-width: 2px;
            transition: all 0.3s ease;
        }

        .action-buttons .btn-outline-light:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.15);
        }

        .back-home-btn {
            background-color: var(--teal);
            color: var(--white);
            padding: 14px 36px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 10px 20px rgba(25, 183, 176, 0.3);
            border: 2px solid var(--teal);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .back-home-btn:hover {
            background-color: transparent;
            color: var(--teal);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(25, 183, 176, 0.4);
        }

        /* Floating Medical Elements */
        .floating-element {
            position: absolute;
            opacity: 0.1;
            filter: blur(2px);
            z-index: 1;
            animation: float 10s infinite ease-in-out;
            pointer-events: none;
        }

        .floating-element i {
            font-size: 10rem;
            color: var(--teal);
        }

        .el-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .el-2 { top: 60%; right: 15%; animation-delay: 2s; font-size: 8rem; color: var(--accent); }
        .el-3 { bottom: 10%; left: 20%; animation-delay: 4s; }
        .el-4 { top: 20%; right: 25%; animation-delay: 1s; opacity: 0.05; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .glowing-circle {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(25,183,176,0.15) 0%, rgba(11,35,65,0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
        }

        /* Responsive Media Queries */
        @media (max-width: 767.98px) {
            .error-page {
                padding: 2.5rem 1rem;
            }
            .floating-element i {
                font-size: 4.5rem !important;
            }
            .el-2 i {
                font-size: 3.5rem !important;
            }
            .glowing-circle {
                width: 300px;
                height: 300px;
            }
        }

        @media (max-width: 575.98px) {
            .error-title {
                font-size: clamp(5.5rem, 24vw, 7rem) !important;
                margin-bottom: 0.25rem;
            }
            .error-subtitle {
                font-size: 1.6rem !important;
                margin-bottom: 0.75rem;
            }
            .error-text {
                font-size: 0.95rem !important;
                padding: 0 0.5rem;
                margin-bottom: 1.75rem;
            }
            .action-buttons {
                flex-direction: column !important;
                align-items: center !important;
                gap: 12px !important;
                width: 100% !important;
                max-width: 290px;
                margin-left: auto;
                margin-right: auto;
            }
            .action-buttons .btn,
            .action-buttons .back-home-btn {
                width: 100% !important;
                padding: 13px 20px !important;
                font-size: 0.9rem !important;
                justify-content: center !important;
                text-align: center !important;
            }
        }
    </style>
</head>
<body class="error-body">
    <div id="preloader" class="preloader"><div class="preloader-content"><img src="assets/images/logo.webp" alt="STACKLY Logo" height="70" class="preloader-logo mb-4"><div class="heartbeat-icon-wrap"><i class="bi bi-heart-pulse-fill preloader-heart-icon"></i></div><p class="preloader-text">HEALTHCARE</p></div></div>

    <section class="error-page">
        <!-- Background Elements -->
        <div class="glowing-circle"></div>
        <div class="floating-element el-1"><i class="bi bi-heart-pulse"></i></div>
        <div class="floating-element el-2"><i class="bi bi-bandaid"></i></div>
        <div class="floating-element el-3"><i class="bi bi-capsule"></i></div>
        <div class="floating-element el-4"><i class="bi bi-shield-plus"></i></div>

        <div class="container relative z-3">
            <div class="error-content">
                <h1 class="error-title" data-aos="zoom-in">404</h1>
                <h2 class="error-subtitle" data-aos="fade-up" data-aos-delay="100">Oops! Wrong Ward.</h2>
                <p class="error-text" data-aos="fade-up" data-aos-delay="200">It looks like you've wandered into an uncharted area of our hospital. The page you're looking for doesn't exist or has been moved.</p>
                <div class="action-buttons d-flex gap-3 justify-content-center mt-4">
                    <button onclick="goBackFrom404()" class="btn btn-outline-light btn-lg rounded-pill px-4 action-btn" data-aos="fade-right" data-aos-delay="250">
                        <i class="bi bi-arrow-left me-2"></i> Go Back
                    </button>
                    <a href="index.html" class="back-home-btn action-btn" data-aos="fade-left" data-aos-delay="250">
                        <i class="bi bi-house-door me-2"></i> Go to Home
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Main JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function goBackFrom404() {
            sessionStorage.setItem('resetFooterForm', 'true');
            sessionStorage.setItem('resetForms', 'true');
            sessionStorage.setItem('resetContactForm', 'true');
            sessionStorage.setItem('resetAppointmentForm', 'true');
            if (window.history.length > 1) {
                window.history.back();
            } else if (document.referrer && window.location.href !== document.referrer) {
                window.location.href = document.referrer;
            } else {
                window.location.href = 'index.html';
            }
        }

        // Additional GSAP Animations for 404
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                gsap.from('.error-title', { duration: 1, y: -50, opacity: 0, ease: 'bounce.out' });
                gsap.from('.error-subtitle', { duration: 1, x: -50, opacity: 0, delay: 0.3 });
                gsap.from('.error-text', { duration: 1, x: 50, opacity: 0, delay: 0.5 });
                gsap.from('.action-buttons', { duration: 1, y: 50, opacity: 0, delay: 0.7, ease: 'back.out(1.7)' });
            }, 2100); // Trigger after preloader
        });
    </script>
</body>
</html>
