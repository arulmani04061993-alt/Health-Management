<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACKLY | Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        .error-page {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary) 0%, #0a192f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .error-content {
            z-index: 10;
            text-align: center;
            color: var(--white);
        }

        .error-title {
            font-size: 15rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0;
            background: linear-gradient(to right, var(--teal), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(25, 183, 176, 0.3);
            position: relative;
        }

        .error-subtitle {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .error-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 2rem;
        }

        .back-home-btn {
            background-color: var(--teal);
            color: var(--white);
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(25, 183, 176, 0.3);
            border: 2px solid var(--teal);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .back-home-btn:hover {
            background-color: transparent;
            color: var(--teal);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(25, 183, 176, 0.4);
        }

        /* Floating Medical Elements */
        .floating-element {
            position: absolute;
            opacity: 0.1;
            filter: blur(2px);
            z-index: 1;
            animation: float 10s infinite ease-in-out;
        }

        .floating-element i {
            font-size: 10rem;
            color: var(--teal);
        }

        .el-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .el-2 { top: 60%; right: 15%; animation-delay: 2s; font-size: 8rem; color: var(--accent); }
        .el-3 { bottom: 10%; left: 20%; animation-delay: 4s; }
        .el-4 { top: 20%; right: 25%; animation-delay: 1s; opacity: 0.05; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .glowing-circle {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(25,183,176,0.15) 0%, rgba(11,35,65,0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="preloader" class="preloader"><div class="preloader-content"><img src="assets/images/logo.webp" alt="STACKLY Logo" height="70" class="preloader-logo mb-4"><div class="heartbeat-icon-wrap"><i class="bi bi-heart-pulse-fill preloader-heart-icon"></i></div><p class="preloader-text">HEALTHCARE</p></div></div>

    <section class="error-page">
        <!-- Background Elements -->
        <div class="glowing-circle"></div>
        <div class="floating-element el-1"><i class="bi bi-heart-pulse"></i></div>
        <div class="floating-element el-2"><i class="bi bi-bandaid"></i></div>
        <div class="floating-element el-3"><i class="bi bi-capsule"></i></div>
        <div class="floating-element el-4"><i class="bi bi-shield-plus"></i></div>

        <div class="container relative z-3">
            <div class="error-content">
                <h1 class="error-title">404</h1>
                <h2 class="error-subtitle">Oops! Wrong Ward.</h2>
                <p class="error-text">It looks like you've wandered into an uncharted area of our hospital. The page you're looking for doesn't exist or has been moved.</p>
                <div class="action-buttons d-flex gap-3 justify-content-center mt-4">
                    <button onclick="history.back()" class="btn btn-outline-light btn-lg rounded-pill px-4 action-btn">
                        <i class="bi bi-arrow-left me-2"></i> Go Back
                    </button>
                    <a href="index.html" class="back-home-btn action-btn">
                        <i class="bi bi-house-door me-2"></i> Go to Home
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Main JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Additional GSAP Animations for 404
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                gsap.from('.error-title', { duration: 1, y: -50, opacity: 0, ease: 'bounce.out' });
                gsap.from('.error-subtitle', { duration: 1, x: -50, opacity: 0, delay: 0.3 });
                gsap.from('.error-text', { duration: 1, x: 50, opacity: 0, delay: 0.5 });
                gsap.from('.action-buttons', { duration: 1, y: 50, opacity: 0, delay: 0.7, ease: 'back.out(1.7)' });
            }, 2100); // Trigger after preloader
        });
    </script>
</body>
</html>
